[project]
name = "orqevia-runtime-toolchain"
version = "0.0.0"
description = "Reproducible development and verification environment for ORQEVIA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pandas==3.1.1",
    "psutil==7.2.2",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "python-multipart==0.0.33",
    "uvicorn[standard]==0.54.0",
    "wasmtime==50.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    ".pytest-tmp-*",
    ".venv",
    "__pycache__",
    "clients/dell/build",
    "node_modules",
]

[tool.ruff.lint]
select = ["E9", "F"]
# Legacy modules intentionally contain compact single-line functions and dynamic
# imports. These baseline exclusions keep the deterministic runtime untouched;
# scripts/check_ruff_changed.py applies the full E9/F rules to every changed file.
ignore = ["F401", "F403", "F405", "F811", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
