name: ${COMPOSE_PROJECT_NAME:-orqevia}

services:
  backend:
    build:
      context: .
      args:
        PRIME_RUNTIME_REVISION: ${PRIME_RUNTIME_REVISION:-UNKNOWN}
    image: ${PRIME_IMAGE:-orqevia:local}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "backend"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    ports:
      - "${PRIME_BIND_ADDRESS:-127.0.0.1}:${PRIME_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Queue admission compares this declaration with the measured profile.
      # Keep N=1 unless an isolated qualification authorizes a higher value.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      PRIME_NODE_ID: ${PRIME_NODE_ID:-orqevia-node-01}
      PRIME_NODE_ROLE: ${PRIME_NODE_ROLE:-control-compute}
      PRIME_INTERFACE_HOST_ID: ${PRIME_INTERFACE_HOST_ID:-}
      PRIME_RUNTIME_REVISION: ${PRIME_RUNTIME_REVISION:-UNKNOWN}
      PRIME_INTERFACE_RUNTIME_VERSION: ${PRIME_INTERFACE_RUNTIME_VERSION:-UNKNOWN}
      PRIME_RUNTIME_IMAGE_DIGEST: ${PRIME_RUNTIME_IMAGE_DIGEST:-}
      PRIME_OWNER_TRUSTED_PEERS: ${PRIME_OWNER_TRUSTED_PEERS:-}
      PRIME_COMPUTE_PROFILE: ${PRIME_COMPUTE_PROFILE:-balanced}
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EVALUATOR_MODEL: ${PRIME_EVALUATOR_MODEL:-}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
      PRIME_MULTI_SPECIALIST_WORKERS: ${PRIME_MULTI_SPECIALIST_WORKERS:-3}
      PRIME_CONTEXT_TOKENS: ${PRIME_CONTEXT_TOKENS:-16384}
      PRIME_MAX_OUTPUT_TOKENS: ${PRIME_MAX_OUTPUT_TOKENS:-4096}
      PRIME_MODEL_KEEP_ALIVE: ${PRIME_MODEL_KEEP_ALIVE:-10m}
      PRIME_DATA_DIR: /data
      PRIME_SPINE_DB: /data/prime-spine.db
      PRIME_MEMORY_DB: /data/jarvis-memory.db
      PRIME_SPINE_TOKEN: ${PRIME_SPINE_TOKEN:-}
      PRIME_AGENT_CERT_AZURE_ES256_ENABLED: ${PRIME_AGENT_CERT_AZURE_ES256_ENABLED:-0}
      PRIME_PWA_OWNER_ACCOUNT_ID: ${PRIME_PWA_OWNER_ACCOUNT_ID:-}
      PRIME_REGISTRY_V1_ENABLED: ${PRIME_REGISTRY_V1_ENABLED:-1}
      PRIME_CONTEXT_PACKS_ENABLED: ${PRIME_CONTEXT_PACKS_ENABLED:-0}
      PRIME_SKILL_PACKS_ENABLED: ${PRIME_SKILL_PACKS_ENABLED:-0}
      PRIME_SURVIVAL_NETWORK_PROBE_URL: ${PRIME_SURVIVAL_NETWORK_PROBE_URL:-}
      PRIME_SURVIVAL_CLOUD_PROBE_URL: ${PRIME_SURVIVAL_CLOUD_PROBE_URL:-}
      PRIME_SURVIVAL_FETCH_ALLOWLIST: ${PRIME_SURVIVAL_FETCH_ALLOWLIST:-}
      PRIME_SURVIVAL_AUTHORITY_REF: ${PRIME_SURVIVAL_AUTHORITY_REF:-prime-epoch-20260919:owner}
      PRIME_HARNESS_PILOT_ENABLED: ${PRIME_HARNESS_PILOT_ENABLED:-1}
      PRIME_HARNESS_POLICY_VERSION: ${PRIME_HARNESS_POLICY_VERSION:-harness-v0}
      PRIME_HARNESS_SIGNING_SECRET: ${PRIME_HARNESS_SIGNING_SECRET:-}
      PRIME_HARNESS_DB: /data/action-harness.db
      PRIME_INTEGRATION_TOKEN: ${PRIME_INTEGRATION_TOKEN:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://the-portal-ten.vercel.app}
      PORTAL_RESULT_URL: ${PORTAL_RESULT_URL:-}
      PORTAL_RESULT_TOKEN: ${PORTAL_RESULT_TOKEN:-}
      PORTFOLIO_RELAY_URL: ${PORTFOLIO_RELAY_URL:-}
      PORTFOLIO_RELAY_TOKEN: ${PORTFOLIO_RELAY_TOKEN:-}
      PORTFOLIO_RELAY_INTERVAL_SECONDS: ${PORTFOLIO_RELAY_INTERVAL_SECONDS:-15}
      PRIME_PUBLIC_AGENT_TRACE: ${PRIME_PUBLIC_AGENT_TRACE:-0}
      PRIME_PUBLIC_TRACE_RELAY_URL: ${PRIME_PUBLIC_TRACE_RELAY_URL:-https://bksyjvppcwfgwoelnyvp.supabase.co/functions/v1/orqevia-trace-relay}
      PRIME_PUBLIC_TRACE_PUBLISHER_ID: ${PRIME_PUBLIC_TRACE_PUBLISHER_ID:-}
      PRIME_PUBLIC_TRACE_SECRET: ${PRIME_PUBLIC_TRACE_SECRET:-}
      PRIME_PUBLIC_TRACE_INTERVAL_SECONDS: ${PRIME_PUBLIC_TRACE_INTERVAL_SECONDS:-15}
      PRIME_FRONTIER_URL: ${PRIME_FRONTIER_URL:-}
      PRIME_FRONTIER_API_KEY: ${PRIME_FRONTIER_API_KEY:-}
      PRIME_FRONTIER_MODEL: ${PRIME_FRONTIER_MODEL:-}
      PRIME_FRONTIER_MAX_INPUT_CHARS: ${PRIME_FRONTIER_MAX_INPUT_CHARS:-60000}
      PRIME_PROVIDER_CATALOG: ${PRIME_PROVIDER_CATALOG:-/app/config/provider-catalog.active.json}
      PRIME_QUEUE_CONCURRENCY: ${PRIME_QUEUE_CONCURRENCY:-1}
      PRIME_LOCAL_ADMISSION_MODE: ${PRIME_LOCAL_ADMISSION_MODE:-golden_n1}
      PRIME_BACKEND_MEMORY_RECEIPT: ${PRIME_BACKEND_MEMORY_RECEIPT:-}
      PRIME_SSD_THERMAL_ENFORCE: ${PRIME_SSD_THERMAL_ENFORCE:-}
      PRIME_SSD_THERMAL_POLICY: ${PRIME_SSD_THERMAL_POLICY:-}
      PRIME_SSD_THERMAL_POLICY_SHA256: ${PRIME_SSD_THERMAL_POLICY_SHA256:-}
      PRIME_SSD_THERMAL_RECEIPT: ${PRIME_SSD_THERMAL_RECEIPT:-}
      # Optional, SHA-256-pinned file inside the existing orqevia-data volume.
      # Empty values leave production's measured-profile gate disabled at N=1.
      PRIME_MEASURED_COMPUTE_PROFILE: ${PRIME_MEASURED_COMPUTE_PROFILE:-}
      PRIME_MEASURED_COMPUTE_PROFILE_SHA256: ${PRIME_MEASURED_COMPUTE_PROFILE_SHA256:-}
      PRIME_AGENT_CONCURRENCY: ${PRIME_AGENT_CONCURRENCY:-1}
      PRIME_READY_ACTIVITY_MAX_AGE_SECONDS: ${PRIME_READY_ACTIVITY_MAX_AGE_SECONDS:-3600}
      PRIME_LOCAL_RAM_MB: ${PRIME_LOCAL_RAM_MB:-32768}
      PRIME_LOCAL_VRAM_MB: ${PRIME_LOCAL_VRAM_MB:-0}
      PRIME_CLOUD_WAIT_SECONDS: ${PRIME_CLOUD_WAIT_SECONDS:-300}
      PRIME_MAX_JOB_COST_USD: ${PRIME_MAX_JOB_COST_USD:-2}
      PRIME_DAILY_COST_USD: ${PRIME_DAILY_COST_USD:-10}
      PRIME_CLOUD_GPU_URL: ${PRIME_CLOUD_GPU_URL:-}
      PRIME_CLOUD_GPU_API_KEY: ${PRIME_CLOUD_GPU_API_KEY:-}
      PRIME_CLOUD_GPU_MODEL: ${PRIME_CLOUD_GPU_MODEL:-}
      PRIME_CLOUD_GPU_RAM_MB: ${PRIME_CLOUD_GPU_RAM_MB:-131072}
      PRIME_CLOUD_GPU_VRAM_MB: ${PRIME_CLOUD_GPU_VRAM_MB:-81920}
      PRIME_CLOUD_GPU_CONCURRENCY: ${PRIME_CLOUD_GPU_CONCURRENCY:-2}
      PRIME_CLOUD_INPUT_USD_MTOK: ${PRIME_CLOUD_INPUT_USD_MTOK:-0}
      PRIME_CLOUD_OUTPUT_USD_MTOK: ${PRIME_CLOUD_OUTPUT_USD_MTOK:-0}
      ORQEVIA_HIGGSFIELD_ENABLED: ${ORQEVIA_HIGGSFIELD_ENABLED:-0}
      ORQEVIA_HIGGSFIELD_API_KEY_REF: ${ORQEVIA_HIGGSFIELD_API_KEY_REF:-file:HIGGSFIELD_API_KEY}
      ORQEVIA_HIGGSFIELD_API_KEY_ID_REF: ${ORQEVIA_HIGGSFIELD_API_KEY_ID_REF:-}
      ORQEVIA_HIGGSFIELD_API_KEY_SECRET_REF: ${ORQEVIA_HIGGSFIELD_API_KEY_SECRET_REF:-}
      ORQEVIA_HIGGSFIELD_CATALOG_FILE: /run/orqevia-inputs/higgsfield-catalog.json
      ORQEVIA_HIGGSFIELD_CATALOG_SHA256_FILE: /run/orqevia-inputs/higgsfield-catalog.json.sha256
      ORQEVIA_HIGGSFIELD_CATALOG_MAX_AGE_SECONDS: ${ORQEVIA_HIGGSFIELD_CATALOG_MAX_AGE_SECONDS:-86400}
      ORQEVIA_HIGGSFIELD_VALIDATION_FILE: /run/orqevia-inputs/higgsfield-provider-validation.json
      ORQEVIA_HIGGSFIELD_VALIDATION_SHA256_FILE: /run/orqevia-inputs/higgsfield-provider-validation.json.sha256
      ORQEVIA_HIGGSFIELD_VALIDATION_MAX_AGE_SECONDS: ${ORQEVIA_HIGGSFIELD_VALIDATION_MAX_AGE_SECONDS:-86400}
      ORQEVIA_MEDIA_DB: ${ORQEVIA_MEDIA_DB:-/data/media-jobs.db}
      ORQEVIA_MEDIA_MAX_COST_USD: ${ORQEVIA_MEDIA_MAX_COST_USD:-0.25}
      ORQEVIA_MEDIA_MAX_JOBS_PER_DAY: ${ORQEVIA_MEDIA_MAX_JOBS_PER_DAY:-3}
      ORQEVIA_MEDIA_MAX_CONCURRENT_JOBS: ${ORQEVIA_MEDIA_MAX_CONCURRENT_JOBS:-1}
      ORQEVIA_OTEL_ENABLED: ${ORQEVIA_OTEL_ENABLED:-0}
      ORQEVIA_OTEL_ENDPOINT: ${ORQEVIA_OTEL_ENDPOINT:-http://127.0.0.1:4318}
      ORQEVIA_OTEL_SERVICE_NAME: ${ORQEVIA_OTEL_SERVICE_NAME:-orqevia}
      ORQEVIA_OTEL_ENVIRONMENT: ${ORQEVIA_OTEL_ENVIRONMENT:-abex-local}
      ORQEVIA_OTEL_SAMPLE_RATIO: ${ORQEVIA_OTEL_SAMPLE_RATIO:-0.1}
    volumes:
      - orqevia-data:/data
      - type: bind
        source: ${PRIME_PROVIDER_CATALOG_FILE:-./config/provider-catalog.active.json}
        target: /app/config/provider-catalog.active.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PRIME_HF_TOKEN_FILE:-./deploy/unconfigured-hf-token}
        target: /run/secrets/hf_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORQEVIA_HIGGSFIELD_CATALOG_DIR:-C:/ProgramData/ORQEVIA/inputs}
        target: /run/orqevia-inputs
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - higgsfield_api_key
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health', headers={'Authorization': 'Bearer ' + os.environ['PRIME_SPINE_TOKEN']}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  interface:
    profiles: ["clients"]
    image: ${PRIME_INTERFACE_IMAGE:-${PRIME_IMAGE:-orqevia:local}}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "thin-client-interface"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    command: ["uvicorn", "app.interface_server:app", "--host", "0.0.0.0", "--port", "8443", "--no-proxy-headers", "--ssl-keyfile", "/run/prime-tls/server.key", "--ssl-certfile", "/run/prime-tls/server.crt"]
    ports:
      - "${PRIME_INTERFACE_BIND_ADDRESS:-127.0.0.1}:${PRIME_INTERFACE_PORT:-8443}:8443"
    environment:
      PRIME_DATA_DIR: /data
      PRIME_SPINE_TOKEN: ${PRIME_SPINE_TOKEN:-}
      PRIME_INTERFACE_HOST_ID: ${PRIME_INTERFACE_HOST_ID:-}
      PRIME_INTERFACE_SPKI_SHA256: ${PRIME_INTERFACE_SPKI_SHA256:-}
      PRIME_INTERFACE_PUBLIC_KEY: ${PRIME_INTERFACE_PUBLIC_KEY:-}
      PRIME_INTERFACE_RUNTIME_VERSION: ${PRIME_INTERFACE_RUNTIME_VERSION:-UNKNOWN}
      PRIME_INTERFACE_RUNTIME_REVISION: ${PRIME_RUNTIME_REVISION:-UNKNOWN}
      PRIME_RUNTIME_IMAGE_DIGEST: ${PRIME_RUNTIME_IMAGE_DIGEST:-}
      PRIME_INTERFACE_CANDIDATE_STATUS: ${PRIME_INTERFACE_CANDIDATE_STATUS:-UNKNOWN}
      PRIME_PWA_ORIGIN: ${PRIME_PWA_ORIGIN:-}
      PRIME_PWA_ADDITIONAL_ORIGINS: ${PRIME_PWA_ADDITIONAL_ORIGINS:-}
      PRIME_PWA_OWNER_ACCOUNT_ID: ${PRIME_PWA_OWNER_ACCOUNT_ID:-}
      PRIME_PWA_DATA_CLASSIFICATION: ${PRIME_PWA_DATA_CLASSIFICATION:-LOCAL_ONLY}
      PRIME_PWA_MAX_COST_USD: ${PRIME_PWA_MAX_COST_USD:-0}
      PRIME_REGISTRY_V1_ENABLED: ${PRIME_REGISTRY_V1_ENABLED:-1}
      PRIME_COMPUTE_PROFILE: ${PRIME_COMPUTE_PROFILE:-balanced}
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EVALUATOR_MODEL: ${PRIME_EVALUATOR_MODEL:-}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
      PRIME_READY_ACTIVITY_MAX_AGE_SECONDS: ${PRIME_READY_ACTIVITY_MAX_AGE_SECONDS:-3600}
      PRIME_HOST_METRICS_RECEIPT: /run/prime-host-metrics/host-metrics.json
    volumes:
      - orqevia-data:/data
      - type: bind
        source: ${PRIME_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/server.crt
        target: /run/prime-tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PRIME_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/server.key
        target: /run/prime-tls/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PRIME_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/ca.crt
        target: /run/prime-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - "${PRIME_PWA_PROFILE_PATH:-./deploy/unconfigured.mobileconfig}:/app/app/pwa_static/ORQEVIA-ABEX-HTTPS.mobileconfig:ro"
      - type: bind
        source: ${PRIME_HOST_METRICS_DIR:-./deploy/unconfigured-host-metrics}
        target: /run/prime-host-metrics
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; context=ssl.create_default_context(cafile='/run/prime-tls/ca.crt'); urllib.request.urlopen('${PRIME_PWA_ORIGIN:-https://invalid}/pwa/', context=context, timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a reviewed immutable tag or digest}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "model-runtime"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-256}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-true}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - orqevia-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  model-init:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a reviewed immutable tag or digest}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "model-init"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EVALUATOR_MODEL: ${PRIME_EVALUATOR_MODEL:-}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        PRIME_EVALUATOR_MODEL="$${PRIME_EVALUATOR_MODEL:-$${PRIME_DEEP_MODEL}}"
        ollama pull "$${PRIME_FAST_MODEL}"
        if [ "$${PRIME_DEEP_MODEL}" != "$${PRIME_FAST_MODEL}" ]; then ollama pull "$${PRIME_DEEP_MODEL}"; fi
        if [ "$${PRIME_EVALUATOR_MODEL}" != "$${PRIME_FAST_MODEL}" ] && [ "$${PRIME_EVALUATOR_MODEL}" != "$${PRIME_DEEP_MODEL}" ]; then ollama pull "$${PRIME_EVALUATOR_MODEL}"; fi
        ollama pull "$${PRIME_EMBED_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  integration-gateway:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed immutable tag or digest}
    profiles: ["tunnel"]
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "integration-gateway"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    environment:
      PRIME_INTEGRATION_TOKEN: ${PRIME_INTEGRATION_TOKEN:-}
    command: ["/bin/sh", "-c", "test -n \"$${PRIME_INTEGRATION_TOKEN}\" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE to a reviewed immutable tag or digest}
    profiles: ["tunnel"]
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "tunnel"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --loglevel info --metrics 0.0.0.0:2000 run
    volumes:
      - type: bind
        source: ${PRIME_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/ca.crt
        target: /run/prime-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Permanent DELL trust bootstrap: serves only the public estate CA, iOS
  # profile, assessment script and pathway runbook. No secrets.
  trust-bootstrap:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed immutable tag or digest}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "trust-bootstrap"
      com.orqevia.node: "${PRIME_NODE_ID:-orqevia-node-01}"
    command: ["caddy", "file-server", "--listen", ":8081", "--root", "/bootstrap"]
    ports:
      - "${PRIME_INTERFACE_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - type: bind
        source: C:\Users\Admin\Documents\ABEX\operations\dell-co-owner\bootstrap
        target: /bootstrap
        read_only: true
    restart: always
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  orqevia-data:
    external: true
    name: ${PRIME_DATA_VOLUME:-orqevia-data}
  orqevia-ollama-data:
    external: true
    name: ${OLLAMA_DATA_VOLUME:-orqevia-ollama-data}

secrets:
  higgsfield_api_key:
    file: ${ORQEVIA_HIGGSFIELD_API_KEY_FILE:-C:/Users/Admin/Documents/ABEX/secrets/higgsfield_api_key.txt}
