name: ${COMPOSE_PROJECT_NAME:-prime}

services:
  prime:
    build:
      context: .
    image: ${PRIME_IMAGE:-prime:local}
    labels:
      com.lamjarvis.managed: "true"
      com.lamjarvis.role: "prime"
      com.lamjarvis.node: "${PRIME_NODE_ID:-prime-node-01}"
    ports:
      - "${PRIME_BIND_ADDRESS:-127.0.0.1}:${PRIME_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PRIME_NODE_ID: ${PRIME_NODE_ID:-prime-node-01}
      PRIME_NODE_ROLE: ${PRIME_NODE_ROLE:-control-compute}
      PRIME_COMPUTE_PROFILE: ${PRIME_COMPUTE_PROFILE:-balanced}
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EVALUATOR_MODEL: ${PRIME_EVALUATOR_MODEL:-}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
      PRIME_MULTI_SPECIALIST_WORKERS: ${PRIME_MULTI_SPECIALIST_WORKERS:-3}
      PRIME_CONTEXT_TOKENS: ${PRIME_CONTEXT_TOKENS:-16384}
      PRIME_MAX_OUTPUT_TOKENS: ${PRIME_MAX_OUTPUT_TOKENS:-4096}
      PRIME_MODEL_KEEP_ALIVE: ${PRIME_MODEL_KEEP_ALIVE:-10m}
      PRIME_DATA_DIR: /data
      PRIME_SPINE_DB: /data/prime-spine.db
      PRIME_MEMORY_DB: /data/jarvis-memory.db
      PRIME_SPINE_TOKEN: ${PRIME_SPINE_TOKEN:-}
      PRIME_HARNESS_PILOT_ENABLED: ${PRIME_HARNESS_PILOT_ENABLED:-1}
      PRIME_HARNESS_POLICY_VERSION: ${PRIME_HARNESS_POLICY_VERSION:-harness-v0}
      PRIME_HARNESS_SIGNING_SECRET: ${PRIME_HARNESS_SIGNING_SECRET:-}
      PRIME_HARNESS_DB: /data/action-harness.db
      PRIME_INTEGRATION_TOKEN: ${PRIME_INTEGRATION_TOKEN:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://the-portal-ten.vercel.app}
      PORTAL_RESULT_URL: ${PORTAL_RESULT_URL:-}
      PORTAL_RESULT_TOKEN: ${PORTAL_RESULT_TOKEN:-}
      PORTFOLIO_RELAY_URL: ${PORTFOLIO_RELAY_URL:-}
      PORTFOLIO_RELAY_TOKEN: ${PORTFOLIO_RELAY_TOKEN:-}
      PORTFOLIO_RELAY_INTERVAL_SECONDS: ${PORTFOLIO_RELAY_INTERVAL_SECONDS:-15}
      PRIME_PUBLIC_AGENT_TRACE: ${PRIME_PUBLIC_AGENT_TRACE:-0}
      PRIME_PUBLIC_TRACE_RELAY_URL: ${PRIME_PUBLIC_TRACE_RELAY_URL:-https://bksyjvppcwfgwoelnyvp.supabase.co/functions/v1/jarvis-trace-relay}
      PRIME_PUBLIC_TRACE_PUBLISHER_ID: ${PRIME_PUBLIC_TRACE_PUBLISHER_ID:-prime-dell-1}
      PRIME_PUBLIC_TRACE_SECRET: ${PRIME_PUBLIC_TRACE_SECRET:-}
      PRIME_PUBLIC_TRACE_INTERVAL_SECONDS: ${PRIME_PUBLIC_TRACE_INTERVAL_SECONDS:-15}
      PRIME_FRONTIER_URL: ${PRIME_FRONTIER_URL:-}
      PRIME_FRONTIER_API_KEY: ${PRIME_FRONTIER_API_KEY:-}
      PRIME_FRONTIER_MODEL: ${PRIME_FRONTIER_MODEL:-}
      PRIME_FRONTIER_MAX_INPUT_CHARS: ${PRIME_FRONTIER_MAX_INPUT_CHARS:-60000}
      PRIME_QUEUE_CONCURRENCY: ${PRIME_QUEUE_CONCURRENCY:-1}
      PRIME_AGENT_CONCURRENCY: ${PRIME_AGENT_CONCURRENCY:-1}
      PRIME_LOCAL_RAM_MB: ${PRIME_LOCAL_RAM_MB:-32768}
      PRIME_LOCAL_VRAM_MB: ${PRIME_LOCAL_VRAM_MB:-0}
      PRIME_CLOUD_WAIT_SECONDS: ${PRIME_CLOUD_WAIT_SECONDS:-300}
      PRIME_MAX_JOB_COST_USD: ${PRIME_MAX_JOB_COST_USD:-2}
      PRIME_DAILY_COST_USD: ${PRIME_DAILY_COST_USD:-10}
      PRIME_CLOUD_GPU_URL: ${PRIME_CLOUD_GPU_URL:-}
      PRIME_CLOUD_GPU_API_KEY: ${PRIME_CLOUD_GPU_API_KEY:-}
      PRIME_CLOUD_GPU_MODEL: ${PRIME_CLOUD_GPU_MODEL:-}
      PRIME_CLOUD_GPU_RAM_MB: ${PRIME_CLOUD_GPU_RAM_MB:-131072}
      PRIME_CLOUD_GPU_VRAM_MB: ${PRIME_CLOUD_GPU_VRAM_MB:-81920}
      PRIME_CLOUD_GPU_CONCURRENCY: ${PRIME_CLOUD_GPU_CONCURRENCY:-2}
      PRIME_CLOUD_INPUT_USD_MTOK: ${PRIME_CLOUD_INPUT_USD_MTOK:-0}
      PRIME_CLOUD_OUTPUT_USD_MTOK: ${PRIME_CLOUD_OUTPUT_USD_MTOK:-0}
    volumes:
      - prime-data:/data
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    labels:
      com.lamjarvis.managed: "true"
      com.lamjarvis.role: "model-runtime"
      com.lamjarvis.node: "${PRIME_NODE_ID:-prime-node-01}"
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-256}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-true}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    labels:
      com.lamjarvis.managed: "true"
      com.lamjarvis.role: "model-init"
      com.lamjarvis.node: "${PRIME_NODE_ID:-prime-node-01}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EVALUATOR_MODEL: ${PRIME_EVALUATOR_MODEL:-}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        PRIME_EVALUATOR_MODEL="$${PRIME_EVALUATOR_MODEL:-$${PRIME_DEEP_MODEL}}"
        ollama pull "$${PRIME_FAST_MODEL}"
        if [ "$${PRIME_DEEP_MODEL}" != "$${PRIME_FAST_MODEL}" ]; then ollama pull "$${PRIME_DEEP_MODEL}"; fi
        if [ "$${PRIME_EVALUATOR_MODEL}" != "$${PRIME_FAST_MODEL}" ] && [ "$${PRIME_EVALUATOR_MODEL}" != "$${PRIME_DEEP_MODEL}" ]; then ollama pull "$${PRIME_EVALUATOR_MODEL}"; fi
        ollama pull "$${PRIME_EMBED_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  integration-gateway:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles: ["tunnel"]
    labels:
      com.lamjarvis.managed: "true"
      com.lamjarvis.role: "integration-gateway"
      com.lamjarvis.node: "${PRIME_NODE_ID:-prime-node-01}"
    environment:
      PRIME_INTEGRATION_TOKEN: ${PRIME_INTEGRATION_TOKEN:-}
    command: ["/bin/sh", "-c", "test -n \"$${PRIME_INTEGRATION_TOKEN}\" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      prime:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["tunnel"]
    labels:
      com.lamjarvis.managed: "true"
      com.lamjarvis.role: "tunnel"
      com.lamjarvis.node: "${PRIME_NODE_ID:-prime-node-01}"
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --loglevel info --metrics 0.0.0.0:2000 run
    depends_on:
      integration-gateway:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  prime-data:
    external: true
    name: ${PRIME_DATA_VOLUME:-prime-data}
  ollama-data:
    external: true
    name: ${OLLAMA_DATA_VOLUME:-prime-ollama-data}
