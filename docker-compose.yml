name: ${COMPOSE_PROJECT_NAME:-orqevia}

services:
  backend:
    build:
      context: .
      args:
        ORQEVIA_RUNTIME_REVISION: ${ORQEVIA_RUNTIME_REVISION:-UNKNOWN}
    image: ${ORQEVIA_IMAGE:-orqevia:local}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "backend"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    ports:
      - "${ORQEVIA_BIND_ADDRESS:-127.0.0.1}:${ORQEVIA_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Queue admission compares this declaration with the measured profile.
      # Keep N=1 unless an isolated qualification authorizes a higher value.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      ORQEVIA_NODE_ID: ${ORQEVIA_NODE_ID:-orqevia-node-01}
      ORQEVIA_NODE_ROLE: ${ORQEVIA_NODE_ROLE:-control-compute}
      ORQEVIA_INTERFACE_HOST_ID: ${ORQEVIA_INTERFACE_HOST_ID:-}
      ORQEVIA_RUNTIME_REVISION: ${ORQEVIA_RUNTIME_REVISION:-UNKNOWN}
      ORQEVIA_PIF_ENABLED: ${ORQEVIA_PIF_ENABLED:-0}
      ORQEVIA_MEL_ENABLED: ${ORQEVIA_MEL_ENABLED:-0}
      ORQEVIA_INTERFACE_RUNTIME_VERSION: ${ORQEVIA_INTERFACE_RUNTIME_VERSION:-UNKNOWN}
      ORQEVIA_RUNTIME_IMAGE_DIGEST: ${ORQEVIA_RUNTIME_IMAGE_DIGEST:-}
      ORQEVIA_OWNER_TRUSTED_PEERS: ${ORQEVIA_OWNER_TRUSTED_PEERS:-}
      ORQEVIA_COMPUTE_PROFILE: ${ORQEVIA_COMPUTE_PROFILE:-balanced}
      ORQEVIA_FAST_MODEL: ${ORQEVIA_FAST_MODEL:-gemma3:1b}
      ORQEVIA_DEEP_MODEL: ${ORQEVIA_DEEP_MODEL:-gemma3:4b}
      ORQEVIA_EVALUATOR_MODEL: ${ORQEVIA_EVALUATOR_MODEL:-gemma3:4b}
      ORQEVIA_EMBED_MODEL: ${ORQEVIA_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
      ORQEVIA_MULTI_SPECIALIST_WORKERS: ${ORQEVIA_MULTI_SPECIALIST_WORKERS:-3}
      ORQEVIA_CONTEXT_TOKENS: ${ORQEVIA_CONTEXT_TOKENS:-16384}
      ORQEVIA_MAX_OUTPUT_TOKENS: ${ORQEVIA_MAX_OUTPUT_TOKENS:-4096}
      ORQEVIA_MODEL_KEEP_ALIVE: ${ORQEVIA_MODEL_KEEP_ALIVE:-10m}
      ORQEVIA_DATA_DIR: /data
      ORQEVIA_SPINE_DB: /data/orqevia-spine.db
      ORQEVIA_MEMORY_DB: /data/orqevia-memory.db
      ORQEVIA_SPINE_TOKEN: ${ORQEVIA_SPINE_TOKEN:-}
      ORQEVIA_TAVILY_API_KEY: ${ORQEVIA_TAVILY_API_KEY:-}
      ORQEVIA_AGENT_CERT_AZURE_ES256_ENABLED: ${ORQEVIA_AGENT_CERT_AZURE_ES256_ENABLED:-0}
      ORQEVIA_PWA_OWNER_ACCOUNT_ID: ${ORQEVIA_PWA_OWNER_ACCOUNT_ID:-}
      ORQEVIA_REGISTRY_V1_ENABLED: ${ORQEVIA_REGISTRY_V1_ENABLED:-1}
      PRIME_REGISTRY_V1_ENABLED: ${PRIME_REGISTRY_V1_ENABLED:-1}
      ORQEVIA_CONTEXT_PACKS_ENABLED: ${ORQEVIA_CONTEXT_PACKS_ENABLED:-0}
      ORQEVIA_SKILL_PACKS_ENABLED: ${ORQEVIA_SKILL_PACKS_ENABLED:-0}
      ORQEVIA_NOTEBOOK_ROLLOUT: ${ORQEVIA_NOTEBOOK_ROLLOUT:-none}
      ORQEVIA_AGENT_NOTEBOOKS_AUTO_WRITE: ${ORQEVIA_AGENT_NOTEBOOKS_AUTO_WRITE:-0}
      ORQEVIA_NOTEBOOK_ADMIN_TOKEN: ${ORQEVIA_NOTEBOOK_ADMIN_TOKEN:-}
      ORQEVIA_PROJECT_WORKFLOW_DB: ${ORQEVIA_PROJECT_WORKFLOW_DB:-/data/project-workflows.db}
      ORQEVIA_PROJECT_WORKFLOW_DIR: ${ORQEVIA_PROJECT_WORKFLOW_DIR:-/data/project-workflows}
      ORQEVIA_SURVIVAL_NETWORK_PROBE_URL: ${ORQEVIA_SURVIVAL_NETWORK_PROBE_URL:-}
      ORQEVIA_SURVIVAL_CLOUD_PROBE_URL: ${ORQEVIA_SURVIVAL_CLOUD_PROBE_URL:-}
      ORQEVIA_SURVIVAL_FETCH_ALLOWLIST: ${ORQEVIA_SURVIVAL_FETCH_ALLOWLIST:-}
      ORQEVIA_SURVIVAL_AUTHORITY_REF: ${ORQEVIA_SURVIVAL_AUTHORITY_REF:-prime-epoch-20260919:owner}
      ORQEVIA_HARNESS_PILOT_ENABLED: ${ORQEVIA_HARNESS_PILOT_ENABLED:-1}
      ORQEVIA_HARNESS_POLICY_VERSION: ${ORQEVIA_HARNESS_POLICY_VERSION:-harness-v0}
      ORQEVIA_HARNESS_SIGNING_SECRET: ${ORQEVIA_HARNESS_SIGNING_SECRET:-}
      ORQEVIA_HARNESS_DB: /data/action-harness.db
      ORQEVIA_INTEGRATION_TOKEN: ${ORQEVIA_INTEGRATION_TOKEN:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://the-portal-ten.vercel.app}
      PORTAL_RESULT_URL: ${PORTAL_RESULT_URL:-}
      PORTAL_RESULT_TOKEN: ${PORTAL_RESULT_TOKEN:-}
      PORTFOLIO_RELAY_URL: ${PORTFOLIO_RELAY_URL:-}
      PORTFOLIO_RELAY_TOKEN: ${PORTFOLIO_RELAY_TOKEN:-}
      PORTFOLIO_RELAY_INTERVAL_SECONDS: ${PORTFOLIO_RELAY_INTERVAL_SECONDS:-15}
      ORQEVIA_PUBLIC_AGENT_TRACE: ${ORQEVIA_PUBLIC_AGENT_TRACE:-0}
      ORQEVIA_PUBLIC_TRACE_RELAY_URL: ${ORQEVIA_PUBLIC_TRACE_RELAY_URL:-https://bksyjvppcwfgwoelnyvp.supabase.co/functions/v1/orqevia-trace-relay}
      ORQEVIA_PUBLIC_TRACE_PUBLISHER_ID: ${ORQEVIA_PUBLIC_TRACE_PUBLISHER_ID:-}
      ORQEVIA_PUBLIC_TRACE_SECRET: ${ORQEVIA_PUBLIC_TRACE_SECRET:-}
      ORQEVIA_PUBLIC_TRACE_INTERVAL_SECONDS: ${ORQEVIA_PUBLIC_TRACE_INTERVAL_SECONDS:-15}
      ORQEVIA_FRONTIER_URL: ${ORQEVIA_FRONTIER_URL:-}
      ORQEVIA_FRONTIER_API_KEY: ${ORQEVIA_FRONTIER_API_KEY:-}
      ORQEVIA_FRONTIER_MODEL: ${ORQEVIA_FRONTIER_MODEL:-}
      ORQEVIA_FRONTIER_MAX_INPUT_CHARS: ${ORQEVIA_FRONTIER_MAX_INPUT_CHARS:-60000}
      ORQEVIA_PROVIDER_CATALOG: ${ORQEVIA_PROVIDER_CATALOG:-/app/config/provider-catalog.active.json}
      ORQEVIA_QUEUE_CONCURRENCY: ${ORQEVIA_QUEUE_CONCURRENCY:-1}
      ORQEVIA_LOCAL_ADMISSION_MODE: ${ORQEVIA_LOCAL_ADMISSION_MODE:-golden_n1}
      ORQEVIA_BACKEND_MEMORY_RECEIPT: ${ORQEVIA_BACKEND_MEMORY_RECEIPT:-}
      ORQEVIA_SSD_THERMAL_ENFORCE: ${ORQEVIA_SSD_THERMAL_ENFORCE:-}
      ORQEVIA_SSD_THERMAL_POLICY: ${ORQEVIA_SSD_THERMAL_POLICY:-}
      ORQEVIA_SSD_THERMAL_POLICY_SHA256: ${ORQEVIA_SSD_THERMAL_POLICY_SHA256:-}
      ORQEVIA_SSD_THERMAL_RECEIPT: ${ORQEVIA_SSD_THERMAL_RECEIPT:-}
      # Optional, SHA-256-pinned file inside the existing orqevia-data volume.
      # Empty values leave production's measured-profile gate disabled at N=1.
      ORQEVIA_MEASURED_COMPUTE_PROFILE: ${ORQEVIA_MEASURED_COMPUTE_PROFILE:-}
      ORQEVIA_MEASURED_COMPUTE_PROFILE_SHA256: ${ORQEVIA_MEASURED_COMPUTE_PROFILE_SHA256:-}
      ORQEVIA_AGENT_CONCURRENCY: ${ORQEVIA_AGENT_CONCURRENCY:-1}
      ORQEVIA_READY_ACTIVITY_MAX_AGE_SECONDS: ${ORQEVIA_READY_ACTIVITY_MAX_AGE_SECONDS:-3600}
      ORQEVIA_LOCAL_RAM_MB: ${ORQEVIA_LOCAL_RAM_MB:-32768}
      ORQEVIA_LOCAL_VRAM_MB: ${ORQEVIA_LOCAL_VRAM_MB:-0}
      ORQEVIA_CLOUD_WAIT_SECONDS: ${ORQEVIA_CLOUD_WAIT_SECONDS:-300}
      ORQEVIA_MAX_JOB_COST_USD: ${ORQEVIA_MAX_JOB_COST_USD:-2}
      ORQEVIA_DAILY_COST_USD: ${ORQEVIA_DAILY_COST_USD:-10}
      ORQEVIA_CLOUD_GPU_URL: ${ORQEVIA_CLOUD_GPU_URL:-}
      ORQEVIA_CLOUD_GPU_API_KEY: ${ORQEVIA_CLOUD_GPU_API_KEY:-}
      ORQEVIA_CLOUD_GPU_MODEL: ${ORQEVIA_CLOUD_GPU_MODEL:-}
      ORQEVIA_CLOUD_GPU_RAM_MB: ${ORQEVIA_CLOUD_GPU_RAM_MB:-131072}
      ORQEVIA_CLOUD_GPU_VRAM_MB: ${ORQEVIA_CLOUD_GPU_VRAM_MB:-81920}
      ORQEVIA_CLOUD_GPU_CONCURRENCY: ${ORQEVIA_CLOUD_GPU_CONCURRENCY:-2}
      ORQEVIA_CLOUD_INPUT_USD_MTOK: ${ORQEVIA_CLOUD_INPUT_USD_MTOK:-0}
      ORQEVIA_CLOUD_OUTPUT_USD_MTOK: ${ORQEVIA_CLOUD_OUTPUT_USD_MTOK:-0}
      ORQEVIA_HIGGSFIELD_ENABLED: ${ORQEVIA_HIGGSFIELD_ENABLED:-0}
      ORQEVIA_HIGGSFIELD_API_KEY_REF: ${ORQEVIA_HIGGSFIELD_API_KEY_REF:-file:HIGGSFIELD_API_KEY}
      ORQEVIA_HIGGSFIELD_API_KEY_ID_REF: ${ORQEVIA_HIGGSFIELD_API_KEY_ID_REF:-}
      ORQEVIA_HIGGSFIELD_API_KEY_SECRET_REF: ${ORQEVIA_HIGGSFIELD_API_KEY_SECRET_REF:-}
      ORQEVIA_HIGGSFIELD_CATALOG_FILE: /run/orqevia-inputs/higgsfield-catalog.json
      ORQEVIA_HIGGSFIELD_CATALOG_SHA256_FILE: /run/orqevia-inputs/higgsfield-catalog.json.sha256
      ORQEVIA_HIGGSFIELD_CATALOG_MAX_AGE_SECONDS: ${ORQEVIA_HIGGSFIELD_CATALOG_MAX_AGE_SECONDS:-86400}
      ORQEVIA_HIGGSFIELD_VALIDATION_FILE: /run/orqevia-inputs/higgsfield-provider-validation.json
      ORQEVIA_HIGGSFIELD_VALIDATION_SHA256_FILE: /run/orqevia-inputs/higgsfield-provider-validation.json.sha256
      ORQEVIA_HIGGSFIELD_VALIDATION_MAX_AGE_SECONDS: ${ORQEVIA_HIGGSFIELD_VALIDATION_MAX_AGE_SECONDS:-86400}
      ORQEVIA_HIGGSFIELD_GENERATION_FILE: /run/orqevia-inputs/higgsfield-generation-acceptance.json
      ORQEVIA_HIGGSFIELD_GENERATION_SHA256_FILE: /run/orqevia-inputs/higgsfield-generation-acceptance.json.sha256
      ORQEVIA_HIGGSFIELD_GENERATION_MAX_AGE_SECONDS: ${ORQEVIA_HIGGSFIELD_GENERATION_MAX_AGE_SECONDS:-31536000}
      ORQEVIA_MEDIA_DB: ${ORQEVIA_MEDIA_DB:-/data/media-jobs.db}
      ORQEVIA_MEDIA_MAX_COST_USD: ${ORQEVIA_MEDIA_MAX_COST_USD:-0.25}
      ORQEVIA_MEDIA_MAX_JOBS_PER_DAY: ${ORQEVIA_MEDIA_MAX_JOBS_PER_DAY:-3}
      ORQEVIA_MEDIA_MAX_CONCURRENT_JOBS: ${ORQEVIA_MEDIA_MAX_CONCURRENT_JOBS:-1}
      ORQEVIA_OTEL_ENABLED: ${ORQEVIA_OTEL_ENABLED:-0}
      ORQEVIA_OTEL_ENDPOINT: ${ORQEVIA_OTEL_ENDPOINT:-http://127.0.0.1:4318}
      ORQEVIA_OTEL_SERVICE_NAME: ${ORQEVIA_OTEL_SERVICE_NAME:-orqevia}
      ORQEVIA_OTEL_ENVIRONMENT: ${ORQEVIA_OTEL_ENVIRONMENT:-abex-local}
      ORQEVIA_OTEL_SAMPLE_RATIO: ${ORQEVIA_OTEL_SAMPLE_RATIO:-0.1}
    volumes:
      - orqevia-data:/data
      - type: bind
        source: ${ORQEVIA_PROVIDER_CATALOG_FILE:-./config/provider-catalog.active.json}
        target: /app/config/provider-catalog.active.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORQEVIA_HF_TOKEN_FILE:-./deploy/unconfigured-hf-token}
        target: /run/secrets/hf_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORQEVIA_HIGGSFIELD_CATALOG_DIR:-C:/ProgramData/ORQEVIA/inputs}
        target: /run/orqevia-inputs
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - higgsfield_api_key
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health', headers={'Authorization': 'Bearer ' + os.environ['ORQEVIA_SPINE_TOKEN']}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  interface:
    profiles: ["clients"]
    image: ${ORQEVIA_INTERFACE_IMAGE:-${ORQEVIA_IMAGE:-orqevia:local}}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "thin-client-interface"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    command: ["uvicorn", "app.interface_server:app", "--host", "0.0.0.0", "--port", "8443", "--no-proxy-headers", "--ssl-keyfile", "/run/orqevia-tls/server.key", "--ssl-certfile", "/run/orqevia-tls/server.crt"]
    ports:
      - "${ORQEVIA_INTERFACE_BIND_ADDRESS:-127.0.0.1}:${ORQEVIA_INTERFACE_PORT:-8443}:8443"
    environment:
      ORQEVIA_DATA_DIR: /data
      ORQEVIA_SPINE_TOKEN: ${ORQEVIA_SPINE_TOKEN:-}
      ORQEVIA_TAVILY_API_KEY: ${ORQEVIA_TAVILY_API_KEY:-}
      ORQEVIA_INTERFACE_HOST_ID: ${ORQEVIA_INTERFACE_HOST_ID:-}
      ORQEVIA_INTERFACE_SPKI_SHA256: ${ORQEVIA_INTERFACE_SPKI_SHA256:-}
      ORQEVIA_INTERFACE_PUBLIC_KEY: ${ORQEVIA_INTERFACE_PUBLIC_KEY:-}
      ORQEVIA_INTERFACE_RUNTIME_VERSION: ${ORQEVIA_INTERFACE_RUNTIME_VERSION:-UNKNOWN}
      ORQEVIA_INTERFACE_RUNTIME_REVISION: ${ORQEVIA_RUNTIME_REVISION:-UNKNOWN}
      ORQEVIA_RUNTIME_IMAGE_DIGEST: ${ORQEVIA_RUNTIME_IMAGE_DIGEST:-}
      ORQEVIA_INTERFACE_CANDIDATE_STATUS: ${ORQEVIA_INTERFACE_CANDIDATE_STATUS:-UNKNOWN}
      ORQEVIA_PWA_ORIGIN: ${ORQEVIA_PWA_ORIGIN:-}
      ORQEVIA_PWA_ADDITIONAL_ORIGINS: ${ORQEVIA_PWA_ADDITIONAL_ORIGINS:-}
      ORQEVIA_PWA_OWNER_ACCOUNT_ID: ${ORQEVIA_PWA_OWNER_ACCOUNT_ID:-}
      ORQEVIA_PWA_DATA_CLASSIFICATION: ${ORQEVIA_PWA_DATA_CLASSIFICATION:-LOCAL_ONLY}
      ORQEVIA_PWA_MAX_COST_USD: ${ORQEVIA_PWA_MAX_COST_USD:-0}
      ORQEVIA_REGISTRY_V1_ENABLED: ${ORQEVIA_REGISTRY_V1_ENABLED:-1}
      ORQEVIA_COMPUTE_PROFILE: ${ORQEVIA_COMPUTE_PROFILE:-balanced}
      ORQEVIA_FAST_MODEL: ${ORQEVIA_FAST_MODEL:-gemma3:1b}
      ORQEVIA_DEEP_MODEL: ${ORQEVIA_DEEP_MODEL:-gemma3:4b}
      ORQEVIA_EVALUATOR_MODEL: ${ORQEVIA_EVALUATOR_MODEL:-gemma3:4b}
      ORQEVIA_EMBED_MODEL: ${ORQEVIA_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
      ORQEVIA_READY_ACTIVITY_MAX_AGE_SECONDS: ${ORQEVIA_READY_ACTIVITY_MAX_AGE_SECONDS:-3600}
      ORQEVIA_HOST_METRICS_RECEIPT: /run/orqevia-host-metrics/host-metrics.json
      ORQEVIA_BACKEND_BASE_URL: ${ORQEVIA_BACKEND_BASE_URL:-http://backend:8000}
      ORQEVIA_NOTEBOOK_ADMIN_TOKEN: ${ORQEVIA_NOTEBOOK_ADMIN_TOKEN:-}
    volumes:
      - orqevia-data:/data
      - type: bind
        source: ${ORQEVIA_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/server.crt
        target: /run/orqevia-tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORQEVIA_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/server.key
        target: /run/orqevia-tls/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ORQEVIA_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/ca.crt
        target: /run/orqevia-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - "${ORQEVIA_PWA_PROFILE_PATH:-./deploy/unconfigured.mobileconfig}:/app/app/pwa_static/ORQEVIA-ABEX-HTTPS.mobileconfig:ro"
      - type: bind
        source: ${ORQEVIA_HOST_METRICS_DIR:-./deploy/unconfigured-host-metrics}
        target: /run/orqevia-host-metrics
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; context=ssl.create_default_context(cafile='/run/orqevia-tls/ca.crt'); urllib.request.urlopen('${ORQEVIA_PWA_ORIGIN:-https://invalid}/pwa/', context=context, timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a reviewed immutable tag or digest}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "model-runtime"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-256}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-true}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - orqevia-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  model-init:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a reviewed immutable tag or digest}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "model-init"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      ORQEVIA_FAST_MODEL: ${ORQEVIA_FAST_MODEL:-gemma3:1b}
      ORQEVIA_DEEP_MODEL: ${ORQEVIA_DEEP_MODEL:-gemma3:4b}
      ORQEVIA_EVALUATOR_MODEL: ${ORQEVIA_EVALUATOR_MODEL:-gemma3:4b}
      ORQEVIA_EMBED_MODEL: ${ORQEVIA_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ORQEVIA_EVALUATOR_MODEL="$${ORQEVIA_EVALUATOR_MODEL:-$${ORQEVIA_DEEP_MODEL}}"
        ollama pull "$${ORQEVIA_FAST_MODEL}"
        if [ "$${ORQEVIA_DEEP_MODEL}" != "$${ORQEVIA_FAST_MODEL}" ]; then ollama pull "$${ORQEVIA_DEEP_MODEL}"; fi
        if [ "$${ORQEVIA_EVALUATOR_MODEL}" != "$${ORQEVIA_FAST_MODEL}" ] && [ "$${ORQEVIA_EVALUATOR_MODEL}" != "$${ORQEVIA_DEEP_MODEL}" ]; then ollama pull "$${ORQEVIA_EVALUATOR_MODEL}"; fi
        ollama pull "$${ORQEVIA_EMBED_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  integration-gateway:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed immutable tag or digest}
    profiles: ["tunnel"]
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "integration-gateway"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    environment:
      ORQEVIA_INTEGRATION_TOKEN: ${ORQEVIA_INTEGRATION_TOKEN:-}
    command: ["/bin/sh", "-c", "test -n \"$${ORQEVIA_INTEGRATION_TOKEN}\" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE to a reviewed immutable tag or digest}
    profiles: ["tunnel"]
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "tunnel"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --loglevel info --metrics 0.0.0.0:2000 run
    volumes:
      - type: bind
        source: ${ORQEVIA_INTERFACE_TLS_DIR:-./deploy/unconfigured-tls}/ca.crt
        target: /run/orqevia-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Permanent DELL trust bootstrap: serves only the public estate CA, iOS
  # profile, assessment script and pathway runbook. No secrets.
  trust-bootstrap:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed immutable tag or digest}
    labels:
      com.orqevia.managed: "true"
      com.orqevia.role: "trust-bootstrap"
      com.orqevia.node: "${ORQEVIA_NODE_ID:-orqevia-node-01}"
    command: ["caddy", "file-server", "--listen", ":8081", "--root", "/bootstrap"]
    ports:
      - "${ORQEVIA_INTERFACE_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - type: bind
        source: C:\Users\Admin\Documents\ABEX\operations\dell-co-owner\bootstrap
        target: /bootstrap
