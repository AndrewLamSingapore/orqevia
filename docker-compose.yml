services:
  prime:
    build:
      context: .
    image: ${PRIME_IMAGE:-prime:local}
    ports:
      - "${PRIME_BIND_ADDRESS:-127.0.0.1}:${PRIME_PORT:-8000}:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
      PRIME_DATA_DIR: /data
      PRIME_SPINE_DB: /data/prime-spine.db
      PRIME_MEMORY_DB: /data/jarvis-memory.db
      PRIME_INTEGRATION_TOKEN: ${PRIME_INTEGRATION_TOKEN:-}
      PORTAL_RESULT_URL: ${PORTAL_RESULT_URL:-}
      PORTAL_RESULT_TOKEN: ${PORTAL_RESULT_TOKEN:-}
    volumes:
      - prime-data:/data
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      PRIME_FAST_MODEL: ${PRIME_FAST_MODEL:-gemma3:1b}
      PRIME_DEEP_MODEL: ${PRIME_DEEP_MODEL:-gemma3:1b}
      PRIME_EMBED_MODEL: ${PRIME_EMBED_MODEL:-embeddinggemma:300m-qat-q4_0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${PRIME_FAST_MODEL}"
        if [ "$${PRIME_DEEP_MODEL}" != "$${PRIME_FAST_MODEL}" ]; then ollama pull "$${PRIME_DEEP_MODEL}"; fi
        ollama pull "$${PRIME_EMBED_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  integration-gateway:
    image: caddy:2-alpine
    profiles: ["tunnel"]
    environment:
      PRIME_INTEGRATION_TOKEN: ${PRIME_INTEGRATION_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - test -n "${PRIME_INTEGRATION_TOKEN}" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      prime:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --loglevel info --metrics 0.0.0.0:2000 run
    depends_on:
      integration-gateway:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prime-data:
  ollama-data:
