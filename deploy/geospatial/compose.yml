name: orqevia-geospatial-dev
services:
  database:
    build: .
    image: orqevia:geospatial-dev
    environment:
      POSTGRES_DB: orqevia_dev
      POSTGRES_USER: migration_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    ports: ["127.0.0.1:55439:5432"]
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U migration_owner -d orqevia_dev"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
secrets:
  database_password:
    file: ${ORQEVIA_DEV_DB_PASSWORD_FILE:?absolute private development password file required}
volumes:
  database:
