# Optional exact-version public-key rotation. Apply with docker-compose.yml.
# The host file is reviewed deployment configuration, never agent evidence.
services:
  prime:
    environment:
      PRIME_AGENT_CERT_AZURE_ES256_ENABLED: "1"
      PRIME_AGENT_CERT_AZURE_ES256_PIN_FILE: /run/prime-cert-verifier-pin.json
      PRIME_AGENT_CERT_AZURE_ES256_PIN_SHA256: ${PRIME_AGENT_CERT_AZURE_ES256_PIN_SHA256:?Set reviewed public pin digest}
    volumes:
      - type: bind
        source: ${PRIME_AGENT_CERT_AZURE_ES256_PIN_HOST_FILE:?Set absolute reviewed public pin path}
        target: /run/prime-cert-verifier-pin.json
        read_only: true
        bind:
          create_host_path: false
