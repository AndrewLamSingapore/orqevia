# Sidecar controller only: the existing PRIME service remains the sole executor.
# Point ORQEVIA_COACHING_DATA_VOLUME at its existing Docker data volume.
name: orqevia-coaching
services:
  coaching:
    image: ${ORQEVIA_COACHING_IMAGE:?pinned coaching image required}
    command: [python, -B, -m, app.agent_coaching]
    # Owner requirement: the coaching controller must remain permanently active.
    restart: always
    environment:
      ORQEVIA_DATA_DIR: /data
      ORQEVIA_COMPUTE_QUEUE_DB: /data/compute-queue.db
      ORQEVIA_COACHING_SOURCE_REVISION: ${ORQEVIA_COACHING_SOURCE_REVISION:?source revision required}
      ORQEVIA_PROBABILITY_COACHING_ENABLED: '1'
      ORQEVIA_COACHING_NOTIFY_ORIGIN: ${ORQEVIA_COACHING_NOTIFY_ORIGIN:?verified HTTPS interface origin required}
      ORQEVIA_COACHING_CA_FILE: /run/orqevia-tls/ca.crt
      ORQEVIA_MODEL_KEEP_ALIVE: 2m
      ORQEVIA_COMPUTE_PROFILE: compat
      ORQEVIA_FAST_MODEL: ${ORQEVIA_FAST_MODEL:?existing local fast model required}
      ORQEVIA_DEEP_MODEL: ${ORQEVIA_DEEP_MODEL:?existing local deep model required}
      ORQEVIA_EVALUATOR_MODEL: ${ORQEVIA_EVALUATOR_MODEL:?existing local evaluator required}
      ORQEVIA_EMBED_MODEL: ${ORQEVIA_EMBED_MODEL:?existing local embedding model required}
      OLLAMA_NUM_PARALLEL: '1'
      ORQEVIA_QUEUE_CONCURRENCY: '1'
      ORQEVIA_AGENT_CONCURRENCY: '1'
    volumes:
      - coaching-data:/data
      - ${ORQEVIA_TLS_CA_FILE:?existing public CA certificate required}:/run/orqevia-tls/ca.crt:ro
    networks:
      - orqevia
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '2'}
    healthcheck:
      test: [CMD, python, -c, "import sqlite3,time; c=sqlite3.connect('file:/data/agent-coaching.db?mode=ro',uri=True); r=c.execute('SELECT last_tick_epoch FROM coaching_controller WHERE id=1').fetchone(); c.close(); assert r and 0 <= time.time()-r[0] <= 60"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  coaching-data:
    external: true
    name: ${ORQEVIA_COACHING_DATA_VOLUME:?existing volume required}
networks:
  orqevia:
    external: true
    name: ${ORQEVIA_EPOCH_NETWORK:-orqevia-epoch-20261016_default}
