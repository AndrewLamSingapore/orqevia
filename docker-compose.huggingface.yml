# Opt-in HF credential mount. The base Compose stack does not require this file.
# ORQEVIA_HF_TOKEN_FILE is a host path only; never put token bytes in Compose env.
services:
  backend:
    environment:
      ORQEVIA_PROVIDER_CATALOG: /run/orqevia-models/huggingface.json
    volumes:
      - type: bind
        source: ${ORQEVIA_HF_PROVIDER_CATALOG_FILE:-./config/provider-catalog.huggingface.example.json}
        target: /run/orqevia-models/huggingface.json
        read_only: true
    secrets:
      - hf_token

secrets:
  hf_token:
    file: ${ORQEVIA_HF_TOKEN_FILE:?Set ORQEVIA_HF_TOKEN_FILE to the protected Owner-created token file}
