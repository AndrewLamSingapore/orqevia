<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOD'S EYE · Geospatial Map</title>
  <link rel="stylesheet" href="gods-eye.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <header class="masthead">
    <div><p class="eyebrow">ORQEVIA · OWNER OBSERVATION</p><h1>GOD'S EYE · MAP</h1>
      <p class="subtitle">Observations are real, attributed and freshness-labelled. Empty means no data, not fabricated coverage.</p></div>
    <div class="refresh-controls"><button id="refresh" type="button">Refresh</button><a href="/gods-eye/">Observatory ↗</a></div>
  </header>
  <div class="map-wrap">
    <canvas id="map" width="960" height="480" aria-label="World map with geospatial observations"></canvas>
    <div class="map-meta"><span id="count">0 observations</span><span id="status">IDLE</span></div>
  </div>
  <ul id="events" class="event-list"></ul>
  <script src="map.js"></script>
</body>
</html>
