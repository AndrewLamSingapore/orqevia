name: ORQEVIA independent verifier signer

# A reusable protected-code boundary. The caller may not supply code, secrets,
# signing payloads, or parameters. Only fixed protected reviewed admissions
# may produce case attestations; canaries and empty admissions do not award L7.
on:
  workflow_call:

permissions: {}

jobs:
  signer:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require protected canonical caller
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import os

          expected = "AndrewLamSingapore/orqevia/.github/workflows/prime-verifier-oidc.yml@refs/heads/main"
          if not (
              os.environ["REPOSITORY"] == "AndrewLamSingapore/orqevia"
              and os.environ["REF"] == "refs/heads/main"
              and os.environ["REF_PROTECTED"] == "true"
              and os.environ["EVENT_NAME"] == "workflow_dispatch"
              and os.environ["WORKFLOW_REF"] == expected
          ):
              raise SystemExit("Verifier signer denied: protected canonical caller required")
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind source to protected invocation
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded verification dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 httpx==0.28.1 fastapi==0.116.1
      - name: Check owning initialization verification imports (no signing)
        env:
          PRIME_DATA_DIR: ${{ runner.temp }}/prime-verifier-domains
          PRIME_COMPUTE_QUEUE_DB: ${{ runner.temp }}/prime-verifier-domains/compute-queue.db
        run: |
          python - <<'PY'
          from app.agent_dispatch_api import AgentRequest
          from app.objective_api import inference_attempt_projection
          from app.compute_queue_api import pool, queue
          from app import agent_registry, agent_cert_initialization as initialization

          assert AgentRequest.model_json_schema()['type'] == 'object'
          projection = inference_attempt_projection([])
          assert projection['status'] == 'NOT_APPLICABLE' and projection['attempts'] == []
          assert projection['verification'] == 'UNVERIFIED'
          registry_sha = initialization.sha(agent_registry.REGISTRY_PATH.read_bytes())
          pairs = [(item['id'], capability)
                   for item in agent_registry.load_agent_registry()['agents']
                   for capability in item['capability_requirements']]
          assert len(pairs) == 29 and len({agent for agent, _ in pairs}) == 21
          for agent, capability in pairs:
              initialization._owned_domains(registry_sha, agent, capability)
          assert pool.threads == []
          with queue.connect() as connection:
              assert connection.execute('SELECT COUNT(*) FROM compute_jobs').fetchone()[0] == 0
          print('Initialization verification imports ready; source check only, no signing')
          PY
      - name: Protected Azure sign, public verification, tamper rejection
        run: python -m scripts.azure_verifier_live_canary
      - name: Sign reviewed non-certifying A18 observation
        run: python -m scripts.azure_verifier_observation_canary
      - name: Sign only fixed independently reviewed admitted cases
        env:
          PRIME_DATA_DIR: ${{ runner.temp }}/prime-verifier-domains
          PRIME_COMPUTE_QUEUE_DB: ${{ runner.temp }}/prime-verifier-domains/compute-queue.db
        run: python -m scripts.sign_admitted_agent_cases
      - name: Preserve signed case evidence (not an L7 award)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prime-independent-signed-cases-${{ github.sha }}-${{ github.run_id }}
          path: verifier-output/signed-cases.json
          if-no-files-found: error
          retention-days: 14
