name: Orqevia protected installation validation - 20261016 batch

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: orqevia-protected-installation-20261016-first-validation-only
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'AndrewLamSingapore/orqevia' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded protected validation dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 httpx==0.28.1 fastapi==0.116.1
      - name: One-shot protected installation validation
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B -m scripts.validate_protected_installation_20261016
      - name: Preserve exact validation or failure custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-a7eea39dbfb83769-protected-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: protected-installation-output/
          if-no-files-found: error
          retention-days: 30
