name: Observatory public verifier off-host

on:
  push:
    branches:
      - feat/prime-observatory-protected-verifier-20261006
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install candidate dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Public pin, route, source, freshness and tamper regressions
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_observatory_azure_verifier_bridge.py
          tests/test_agent_cert_azure_es256.py
          tests/test_agent_cert_azure_signer.py
          tests/test_agent_certification.py
          tests/test_agent_capability_observatory.py
          tests/test_production_compatibility.py
      - name: Generate disposable signed case and public pin
        run: python -B -m scripts.observatory_verifier_image_smoke prepare "$RUNNER_TEMP/observatory-verifier" "$GITHUB_SHA"
      - name: Check exact read-only Compose pin contract
        env:
          OLLAMA_IMAGE: ollama/ollama:latest
          CADDY_IMAGE: caddy:latest
          CLOUDFLARED_IMAGE: cloudflare/cloudflared:latest
          PRIME_AGENT_CERT_AZURE_ES256_PIN_HOST_FILE: ${{ runner.temp }}/observatory-verifier/public-pin.json
        shell: bash
        run: |
          export PRIME_AGENT_CERT_AZURE_ES256_PIN_SHA256="$(cat "$RUNNER_TEMP/observatory-verifier/pin.sha256")"
          docker compose -f docker-compose.yml -f deploy/observatory-verifier-pin.override.yml config --format json > "$RUNNER_TEMP/observatory-verifier/compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads((Path(os.environ["RUNNER_TEMP"]) / "observatory-verifier" / "compose.json").read_text())
          prime = config["services"]["prime"]
          assert prime["environment"]["PRIME_AGENT_CERT_AZURE_ES256_ENABLED"] == "1"
          assert prime["environment"]["PRIME_AGENT_CERT_AZURE_ES256_PIN_FILE"] == "/run/prime-cert-verifier-pin.json"
          mounts = [item for item in prime["volumes"] if item["target"] == "/run/prime-cert-verifier-pin.json"]
          assert len(mounts) == 1 and mounts[0]["read_only"] is True
          assert mounts[0]["bind"]["create_host_path"] is False
          PY
      - name: Build disposable runtime image with only reviewed public pin
        run: docker build --tag prime:observatory-verifier-candidate --build-arg PRIME_RUNTIME_REVISION="$GITHUB_SHA" .
      - name: Probe packaged authenticated route with synthetic signed record
        shell: bash
        run: |
          set -euo pipefail
          pin_sha256="$(cat "$RUNNER_TEMP/observatory-verifier/pin.sha256")"
          docker run -d --name prime-observatory-verifier-ci \
            --env PRIME_DATA_DIR=/data \
            --env PRIME_SPINE_TOKEN=fixture-owner-secret \
            --env PRIME_AGENT_CERT_AZURE_ES256_ENABLED=1 \
            --env PRIME_AGENT_CERT_AZURE_ES256_PIN_FILE=/run/prime-cert-verifier-pin.json \
            --env PRIME_AGENT_CERT_AZURE_ES256_PIN_SHA256="$pin_sha256" \
            --mount "type=bind,source=$RUNNER_TEMP/observatory-verifier/data,target=/data" \
            --mount "type=bind,source=$RUNNER_TEMP/observatory-verifier/public-pin.json,target=/run/prime-cert-verifier-pin.json,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/observatory_verifier_image_smoke.py,target=/run/observatory-smoke.py,readonly" \
            --entrypoint python prime:observatory-verifier-candidate \
            -m uvicorn app.production_entry:app --host 127.0.0.1 --port 8000 \
            --no-proxy-headers --lifespan off
          trap 'docker rm -f prime-observatory-verifier-ci >/dev/null 2>&1 || true' EXIT
          docker exec prime-observatory-verifier-ci python /run/observatory-smoke.py probe
