name: Publish ORQEVIA Image

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: publish-prime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-acceptance:
    permissions:
      contents: read
    uses: ./.github/workflows/release-acceptance.yml

  stable-spine:
    permissions:
      contents: read
    uses: ./.github/workflows/stable-spine.yml

  portal-integration:
    permissions:
      contents: read
    uses: ./.github/workflows/portal-integration.yml

  publish:
    needs:
      - ci
      - release-acceptance
      - stable-spine
      - portal-integration
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable and release image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/andrewlamsingapore/orqevia
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
      - name: Build and publish ORQEVIA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            ORQEVIA_RUNTIME_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
