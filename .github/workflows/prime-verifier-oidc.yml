name: PRIME independent verifier OIDC preflight

# No pull-request or feature-ref execution is permitted.
on:
  workflow_dispatch:
    inputs:
      a19_run_id:
        description: Exact protected-main A19 run ID for optional single-case attestation
        required: false
        type: string
      a19_artifact_id:
        description: Exact A19 observation artifact ID
        required: false
        type: string
      a26_run_id:
        description: Exact independent protected-main A26 run ID
        required: false
        type: string
      a26_artifact_id:
        description: Exact A26 observation artifact ID
        required: false
        type: string
      review_run_id:
        description: Exact protected-main independent review run ID
        required: false
        type: string
      review_artifact_id:
        description: Exact independent review artifact ID
        required: false
        type: string

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: none
    outputs:
      permitted: ${{ steps.guard.outputs.permitted }}
    steps:
      - id: guard
        name: Require protected canonical main
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import os

          expected = "AndrewLamSingapore/prime/.github/workflows/prime-verifier-oidc.yml@refs/heads/main"
          allowed = (
              os.environ["REPOSITORY"] == "AndrewLamSingapore/prime"
              and os.environ["REF"] == "refs/heads/main"
              and os.environ["REF_PROTECTED"] == "true"
              and os.environ["EVENT_NAME"] == "workflow_dispatch"
              and os.environ["WORKFLOW_REF"] == expected
          )
          if not allowed:
              raise SystemExit("OIDC preflight denied: protected canonical main is required")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("permitted=true\n")
          PY

  signer:
    # The reusable signer is resolved from main, never from a PR head.
    needs: preflight
    if: needs.preflight.outputs.permitted == 'true'
    uses: AndrewLamSingapore/prime/.github/workflows/prime-verifier-signer.yml@main
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      a19_run_id: ${{ inputs.a19_run_id }}
      a19_artifact_id: ${{ inputs.a19_artifact_id }}
      a26_run_id: ${{ inputs.a26_run_id }}
      a26_artifact_id: ${{ inputs.a26_artifact_id }}
      review_run_id: ${{ inputs.review_run_id }}
      review_artifact_id: ${{ inputs.review_artifact_id }}
