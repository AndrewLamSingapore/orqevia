name: Sync Public Agent Registry

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify registry
        run: |
          pip install -r requirements.txt pytest
          pytest -q tests/test_agent_registry.py
      - name: Export public projection
        run: python scripts/export_agent_registry.py /tmp/jarvis-agent-registry.json
      - name: Require cross-repository publication credential
        env:
          TOKEN: ${{ secrets.AUTHORITY_ENGINE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AUTHORITY_ENGINE_SYNC_TOKEN is not configured; refusing silent registry drift." >&2
            exit 1
          fi
      - name: Publish exact generated projection
        env:
          GH_TOKEN: ${{ secrets.AUTHORITY_ENGINE_SYNC_TOKEN }}
          REPO: AndrewLamSingapore/authority-engine
          PATH_IN_REPO: public/data/jarvis-agent-registry.json
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          repo=os.environ['REPO']; path=os.environ['PATH_IN_REPO']; token=os.environ['GH_TOKEN']
          api=f"https://api.github.com/repos/{repo}/contents/{path}"
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          sha=None
          try:
              req=urllib.request.Request(api,headers=headers)
              with urllib.request.urlopen(req) as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          body=open('/tmp/jarvis-agent-registry.json','rb').read()
          payload={'message':'Sync canonical public JARVIS agent registry','content':base64.b64encode(body).decode(),'branch':'main'}
          if sha: payload['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r:
              out=json.load(r)
          print(out['commit']['sha'])
          PY
