name: Stable Spine

on:
  pull_request:
    paths:
      - 'app/spine.py'
      - 'app/spine_api.py'
      - 'app/memory.py'
      - 'app/meta_review.py'
      - 'app/cognitive_api.py'
      - 'app/cognitive_orchestrator.py'
      - 'app/orchestration.py'
      - 'app/agent_registry.py'
      - 'config/agent_registry.json'
      - 'scripts/export_agent_registry.py'
      - 'app/entry.py'
      - 'contracts/**'
      - 'tests/test_stable_spine.py'
      - 'tests/test_memory_meta.py'
      - 'tests/test_cognitive_orchestrator.py'
      - 'tests/test_consequential_intent.py'
      - 'tests/test_agent_registry.py'
      - 'docker-compose.yml'
      - '.github/workflows/stable-spine.yml'
  push:
    branches: [main]
    paths:
      - 'app/spine.py'
      - 'app/spine_api.py'
      - 'app/memory.py'
      - 'app/meta_review.py'
      - 'app/cognitive_api.py'
      - 'app/cognitive_orchestrator.py'
      - 'app/orchestration.py'
      - 'app/agent_registry.py'
      - 'config/agent_registry.json'
      - 'scripts/export_agent_registry.py'
      - 'app/entry.py'
      - 'contracts/**'
      - 'tests/test_stable_spine.py'
      - 'tests/test_memory_meta.py'
      - 'tests/test_cognitive_orchestrator.py'
      - 'tests/test_consequential_intent.py'
      - 'tests/test_agent_registry.py'
      - 'docker-compose.yml'
      - '.github/workflows/stable-spine.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_stable_spine.py tests/test_memory_meta.py tests/test_cognitive_orchestrator.py tests/test_consequential_intent.py tests/test_router_registration.py tests/test_agent_registry.py
      - name: Export public registry
        run: python scripts/export_agent_registry.py /tmp/public-agent-registry.json
      - name: Reject public disclosure leaks
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/public-agent-registry.json', encoding='utf-8'))
          assert len(p['agents']) == 29
          forbidden={'system_prompt','credentials','endpoint','filesystem_path','tool_secrets','internal_instructions'}
          for a in p['agents']:
              assert not forbidden.intersection(a)
          assert p['relationship_policy']['network_is_enforced'] is True
          PY
