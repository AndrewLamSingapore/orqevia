name: Stable Spine

on:
  pull_request:
    paths:
      - 'app/spine.py'
      - 'app/spine_api.py'
      - 'app/memory.py'
      - 'app/meta_review.py'
      - 'app/cognitive_api.py'
      - 'app/cognitive_orchestrator.py'
      - 'app/entry.py'
      - 'contracts/**'
      - 'tests/test_stable_spine.py'
      - 'tests/test_memory_meta.py'
      - 'tests/test_cognitive_orchestrator.py'
      - 'docker-compose.yml'
      - '.github/workflows/stable-spine.yml'
  push:
    branches: [main]
    paths:
      - 'app/spine.py'
      - 'app/spine_api.py'
      - 'app/memory.py'
      - 'app/meta_review.py'
      - 'app/cognitive_api.py'
      - 'app/cognitive_orchestrator.py'
      - 'app/entry.py'
      - 'contracts/**'
      - 'tests/test_stable_spine.py'
      - 'tests/test_memory_meta.py'
      - 'tests/test_cognitive_orchestrator.py'
      - 'docker-compose.yml'
      - '.github/workflows/stable-spine.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_stable_spine.py tests/test_memory_meta.py tests/test_cognitive_orchestrator.py tests/test_router_registration.py
