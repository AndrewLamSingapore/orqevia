name: ORQEVIA v1 CI
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install test dependencies on isolated CI runner
        run: python -m pip install -r requirements.txt -r requirements-sandbox.txt pytest
      - name: Validate STATUS authority and run offline deterministic security and integration tests
        run: |
          export ORQEVIA_DATA_DIR="$RUNNER_TEMP/prime-fixtures"
          export ORQEVIA_COMPUTE_QUEUE_DB="$ORQEVIA_DATA_DIR/queue.db"
          python scripts/check_canonical_state.py
          python scripts/run_canonical_ci.py
      - name: Release provenance recovery and explicit access-mode regressions
        env:
          ORQEVIA_DATA_DIR: ${{ runner.temp }}/orqevia-release-fixtures
          ORQEVIA_COMPUTE_QUEUE_DB: ${{ runner.temp }}/orqevia-release-fixtures/queue.db
        run: >-
          python -B -m pytest -q
          tests/test_release_provenance_20261021.py
          tests/test_sovereign_isolation_20261021.py
          tests/test_open_access_mode.py
      - name: Parse opt-in HF Compose secret mount without credential
        env:
          OLLAMA_IMAGE: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
          CADDY_IMAGE: caddy@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
          CLOUDFLARED_IMAGE: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          ORQEVIA_HF_TOKEN_FILE: /tmp/placeholder-not-a-token
        run: docker compose -f docker-compose.yml -f docker-compose.huggingface.yml config --quiet
      - name: PWA protocol, voice fallback, idempotency and revision tests
        run: |
          node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1); console.log(process.versions.node)"
          node clients/pwa/tests.mjs
          node clients/pwa/followup-tests.mjs
          node clients/pwa/revision-tests.mjs
          node clients/pwa/dashboard-tests.mjs
          node clients/pwa/dashboard-coaching-tests.mjs
          node --test clients/pwa/packaging-tests.mjs
          node --test clients/pwa/dashboard-race-tests.mjs clients/pwa/operational-facts-tests.mjs clients/pwa/session-race-tests.mjs clients/pwa/sw-update-tests.mjs clients/pwa/intelligence-tests.mjs clients/pwa/intelligence-flow-tests.mjs
          node --test clients/pwa/knowledge-tests.mjs clients/pwa/workspace-tools-tests.mjs
          node --test tests/command_map.test.mjs
          node --test tests/control_surface_approval_security.test.mjs tests/control_surface_health.test.mjs
      - name: Dell canonical-source package and archive regression tests
        run: python -B -m unittest discover -s clients/dell/tools -p test_package_client.py
      - name: Reproducible source package
        run: |
          python scripts/build_source_release.py --output "$RUNNER_TEMP/prime-build-a"
          python scripts/build_source_release.py --output "$RUNNER_TEMP/prime-build-b"
          cmp "$RUNNER_TEMP/prime-build-a/SOURCE_MANIFEST.json" "$RUNNER_TEMP/prime-build-b/SOURCE_MANIFEST.json"
          git diff --exit-code

  tooling-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned uv distribution
        run: python -m pip install --disable-pip-version-check uv==0.13.1
      - name: Create clean locked Python environment
        run: uv sync --frozen --python 3.12 --all-groups
      - name: Verify locked tool versions
        run: |
          uv --version
          uv run python --version
          uv run ruff --version
          uv run pytest --version
      - name: Run canonical state gate in locked environment
        env:
          ORQEVIA_DATA_DIR: ${{ runner.temp }}/orqevia-tooling-fixtures
          ORQEVIA_COMPUTE_QUEUE_DB: ${{ runner.temp }}/orqevia-tooling-fixtures/queue.db
        run: uv run python scripts/run_canonical_ci.py
      - name: Run observability and media-provider tests
        run: >-
          uv run pytest -q
          tests/test_observability.py
          tests/test_media_generation.py
          tests/test_higgsfield_media.py
      - name: Verify loopback OTLP export and privacy
        run: |
          uv run python scripts/verify_observability.py
          uv run python scripts/verify_otel_production.py
      - name: Ruff baseline
        run: uv run ruff check .
      - name: Ruff changed-file strict gate
        env:
          RUFF_BASE_REF: origin/main
        run: uv run python scripts/check_ruff_changed.py
      - name: Compile Python sources
        run: uv run python -m compileall -q app scripts tests

  browser-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/pwa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
      - name: Install locked browser test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium Firefox and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser PWA and workflow assurance
        run: pnpm test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orqevia-browser-assurance
          path: clients/pwa/browser-results
          if-no-files-found: warn
          retention-days: 14
