name: Canonical PRIME v1 CI
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test dependencies on isolated CI runner
        run: python -m pip install -r requirements.txt -r requirements-sandbox.txt pytest
      - name: Validate STATUS authority and run offline deterministic security and integration tests
        run: |
          export PRIME_DATA_DIR="$RUNNER_TEMP/prime-fixtures"
          export PRIME_COMPUTE_QUEUE_DB="$PRIME_DATA_DIR/queue.db"
          python scripts/check_canonical_state.py
          python scripts/run_canonical_ci.py
      - name: Require real RDF SHACL and OWL engines
        run: python -B -c "from app.semantic_fabric import _engines; _engines()"
      - name: Parse opt-in HF Compose secret mount without credential
        env:
          OLLAMA_IMAGE: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
          CADDY_IMAGE: caddy@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
          CLOUDFLARED_IMAGE: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          PRIME_HF_TOKEN_FILE: /tmp/placeholder-not-a-token
        run: docker compose -f docker-compose.yml -f docker-compose.huggingface.yml config --quiet
      - name: PWA protocol, voice fallback, idempotency and revision tests
        run: |
          node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1); console.log(process.versions.node)"
          node clients/pwa/tests.mjs
          node clients/pwa/followup-tests.mjs
          node clients/pwa/revision-tests.mjs
          node --test tests/control_surface_approval_security.test.mjs tests/control_surface_health.test.mjs
          node --test tests/test_gods_eye_ui.js
      - name: Dell canonical-source package and archive regression tests
        run: python -B -m unittest discover -s clients/dell/tools -p test_package_client.py
      - name: Reproducible source package
        run: |
          python scripts/build_source_release.py --output "$RUNNER_TEMP/prime-build-a"
          python scripts/build_source_release.py --output "$RUNNER_TEMP/prime-build-b"
          cmp "$RUNNER_TEMP/prime-build-a/SOURCE_MANIFEST.json" "$RUNNER_TEMP/prime-build-b/SOURCE_MANIFEST.json"
          git diff --exit-code
