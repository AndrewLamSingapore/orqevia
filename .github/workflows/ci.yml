name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-boundary:
    name: Harness execution boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify signed execution boundary and SQLite lifecycle
        env:
          PRIME_DATA_DIR: ${{ runner.temp }}/harness-data
          PRIME_SPINE_DB: ${{ runner.temp }}/harness-data/spine.db
          PRIME_COMPUTE_DB: ${{ runner.temp }}/harness-data/compute-ledger.db
        run: python -m pytest -q tests/test_action_harness.py tests/test_harness_execution.py tests/test_harness_api.py tests/test_job_queue.py tests/test_agent_runtime.py tests/test_stable_spine.py tests/test_sqlite_lifecycle.py tests/test_compute_capacity.py tests/test_memory_meta.py tests/test_p1_api.py tests/test_harness_release_smoke.py tests/test_inference_ingress.py tests/test_harness_process_recovery.py
  quality:
    name: PRIME quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile application and governance tooling
        run: python -m compileall -q app scripts
      - name: Run tests
        env:
          PRIME_DATA_DIR: ${{ runner.temp }}/prime-data
          PRIME_COMPUTE_DB: ${{ runner.temp }}/prime-data/compute-ledger.db
        run: pytest -q
      - name: Validate truthful governance manifest
        run: python scripts/verify_operational_manifest.py --allow-stale
      - name: Reject manually maintained checkpoint drift
        run: python scripts/generate_resume_checkpoint.py --check
