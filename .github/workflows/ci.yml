name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PRIME quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile application
        run: python -m compileall -q app
      - name: Run tests
        env:
          PRIME_DATA_DIR: ${{ runner.temp }}/prime-data
          PRIME_COMPUTE_DB: ${{ runner.temp }}/prime-data/compute-ledger.db
        run: pytest -q
      - name: Validate governance manifest
        run: python scripts/verify_operational_manifest.py
