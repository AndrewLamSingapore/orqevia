name: Release Acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run the complete source suite
        run: python -m pytest -q
      - name: Verify canonical generated contract copies
        run: python scripts/verify_portfolio_contracts.py
      - name: Verify canonical operational manifest and truthful state
        run: python scripts/verify_operational_manifest.py --allow-stale
      - name: Verify the 50-case benchmark manifest
        run: |
          python benchmarks/generate_portfolio_v2.py
          git diff --exit-code -- benchmarks/portfolio-v2.json
      - name: Verify approval-gated and runtime operations contracts
        run: python -m unittest tests.test_control_surface_contract tests.test_runtime_operations_contract
      - name: Verify Workbench approval and health rendering
        run: node --test tests/control_surface_approval_security.test.mjs tests/control_surface_health.test.mjs
      - name: Parse every PowerShell operator
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -LiteralPath "scripts" -Filter "*.ps1" -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $allErrors += $errors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($allErrors.Count) { $allErrors -join "`n" | Write-Error }
      - name: Validate canonical Compose
        env:
          OLLAMA_IMAGE: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
          CADDY_IMAGE: caddy@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
          CLOUDFLARED_IMAGE: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          PRIME_HF_TOKEN_FILE: /tmp/placeholder-not-a-token
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.huggingface.yml config --quiet

  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -t orqevia:acceptance --build-arg PRIME_RUNTIME_REVISION="$GITHUB_SHA" .
      - name: Verify exact source and packaged certification reviewer
        run: |
          test "$(docker image inspect orqevia:acceptance --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python orqevia:acceptance -c "import os; from app import agent_cert_review_tool, agent_cert_role_review, agent_cert_transport; assert os.environ['PRIME_RUNTIME_REVISION'] == '$GITHUB_SHA'"
      - name: Create isolated acceptance network
        run: docker network create orqevia-acceptance
      - name: Verify current production entrypoint, artifact, and restart
        run: |
          docker volume create orqevia-current-data
          docker run -d --name orqevia-current --network orqevia-acceptance \
            -v orqevia-current-data:/data -e PRIME_DATA_DIR=/data \
            -e PRIME_REGISTRY_V1_ENABLED=1 \
            -e PRIME_SPINE_TOKEN=acceptance-secret orqevia:acceptance
          receipt=$(docker run --rm -i --network container:orqevia-current python:3.12-slim python - <<'PY'
          import hashlib, json, time, urllib.error, urllib.request
          base='http://127.0.0.1:8000'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'/health', timeout=2) as response:
                      assert response.status==200 and json.load(response)=={'ok':True}
                  break
              except Exception: time.sleep(1)
          else: raise SystemExit('current production entrypoint never became ready')
          with urllib.request.urlopen(base+'/control', timeout=5) as response:
              assert response.status==200 and b'JARVIS' in response.read()
          try:
              urllib.request.urlopen(urllib.request.Request(base+'/control',headers={'Host':'evil.example'}),timeout=5)
              raise AssertionError('untrusted Host was accepted')
          except urllib.error.HTTPError as error: assert error.code==403
          body=json.dumps({'objective':'Hash supplied text','context':'hello',
                           'capability':'responsibility.a02','deterministic_operation':'sha256'}).encode()
          operation=urllib.request.Request(base+'/control/api/objectives',data=body,method='POST',
                      headers={'Origin':base,'Content-Type':'application/json'})
          with urllib.request.urlopen(operation,timeout=10) as response:
              assert response.status==202
              task_id=json.load(response)['id']
          with urllib.request.urlopen(base+'/control/api/objectives/'+task_id,timeout=10) as response:
              result=json.load(response)
          assert result['state']=='COMPLETED'
          artifact_id=result['steps'][0]['dispatch']['artifact']['artifact_id']
          with urllib.request.urlopen(base+'/control/api/artifacts/'+artifact_id,timeout=10) as response:
              assert hashlib.sha256(b'hello').hexdigest().encode() in response.read()
          print(task_id+'|'+artifact_id)
          PY
          )
          task_id=${receipt%%|*}
          artifact_id=${receipt#*|}
          test -n "$task_id" && test -n "$artifact_id"
          docker rm -f orqevia-current
          docker run -d --name orqevia-current --network orqevia-acceptance \
            -v orqevia-current-data:/data -e PRIME_DATA_DIR=/data \
            -e PRIME_REGISTRY_V1_ENABLED=1 \
            -e PRIME_SPINE_TOKEN=acceptance-secret orqevia:acceptance
          docker run --rm -i --network container:orqevia-current \
            -e TASK_ID="$task_id" -e ARTIFACT_ID="$artifact_id" python:3.12-slim python - <<'PY'
          import hashlib, json, os, time, urllib.request
          base='http://127.0.0.1:8000'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'/control/api/objectives/'+os.environ['TASK_ID'],timeout=2) as response:
                      result=json.load(response)
                  assert result['state']=='COMPLETED'
                  break
              except Exception: time.sleep(1)
          else: raise SystemExit('current objective was not durable after restart')
          with urllib.request.urlopen(base+'/control/api/artifacts/'+os.environ['ARTIFACT_ID'],timeout=10) as response:
              assert hashlib.sha256(b'hello').hexdigest().encode() in response.read()
          print('current entrypoint objective/artifact persistence verified')
          PY
      - name: Benchmark 50 current production deterministic HTTP cases
        run: |
          docker run --rm --network container:orqevia-current \
            --mount "type=bind,source=$GITHUB_WORKSPACE/benchmarks,target=/benchmarks,readonly" \
            python:3.12-slim python /benchmarks/run_production_entrypoint.py --cases 50
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs orqevia-current || true
      - name: Remove disposable acceptance resources
        if: always()
        run: |
          docker rm -f orqevia-current 2>/dev/null || true
          docker volume rm orqevia-current-data 2>/dev/null || true
          docker network rm orqevia-acceptance 2>/dev/null || true
