name: Release Acceptance

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'JARVIS.cmd'
      - 'app/**'
      - 'benchmarks/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'JARVIS.cmd'
      - 'app/**'
      - 'benchmarks/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-acceptance.yml'
  workflow_dispatch:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify approval-gated and runtime operations contracts
        run: python -m unittest tests.test_control_surface_contract tests.test_runtime_operations_contract
      - name: Verify portfolio benchmark gate
        run: python -m unittest tests.test_portfolio_benchmark
      - name: Parse the Windows operator
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/jarvis.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
      - name: Validate canonical Compose
        run: docker compose -f docker-compose.yml config --quiet

  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build -t prime:acceptance .
      - name: Create persistent data volume
        run: docker volume create prime-acceptance-data
      - name: Boot PRIME
        run: |
          docker run -d --name prime-acceptance -p 18000:8000 -v prime-acceptance-data:/data -e PRIME_SPINE_TOKEN=acceptance-secret -e PRIME_SPINE_DB=/data/prime-spine.db -e PRIME_MEMORY_DB=/data/jarvis-memory.db -e PORTAL_BASE_URL=https://the-portal-ten.vercel.app prime:acceptance
      - name: Verify health and immutable safety boundaries
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base='http://127.0.0.1:18000'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'/health',timeout=2) as r:
                      health=json.loads(r.read().decode()); assert r.status==200 and health['ok'] and health['integrity']=='ok'; break
              except Exception: time.sleep(1)
          else: raise SystemExit('PRIME never became healthy')
          req=urllib.request.Request(base+'/api/control-surface/manifest',headers={'Authorization':'Bearer acceptance-secret'})
          with urllib.request.urlopen(req,timeout=5) as r:
              manifest=json.loads(r.read().decode())
              assert manifest['boundaries']['autonomous_actions'] is False
              assert manifest['boundaries']['physical_actuation'] is False
              assert manifest['boundaries']['approval_executes_action'] is False
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs prime-acceptance || true
