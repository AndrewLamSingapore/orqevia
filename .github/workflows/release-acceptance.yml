name: Release Acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # exact historical commit and tag receipts are tested below
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run the complete source suite
        run: python -m pytest -q
      - name: Verify canonical generated contract copies
        run: python scripts/verify_portfolio_contracts.py
      - name: Verify canonical operational manifest and truthful state
        run: python scripts/verify_operational_manifest.py --allow-stale
      - name: Verify the 50-case benchmark manifest
        run: |
          python benchmarks/generate_portfolio_v2.py
          git diff --exit-code -- benchmarks/portfolio-v2.json
      - name: Verify approval-gated and runtime operations contracts
        run: python -m unittest tests.test_control_surface_contract tests.test_runtime_operations_contract
      - name: Parse every PowerShell operator
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -LiteralPath "scripts" -Filter "*.ps1" -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $allErrors += $errors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($allErrors.Count) { $allErrors -join "`n" | Write-Error }
      - name: Validate canonical Compose
        env:
          OLLAMA_IMAGE: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
          CADDY_IMAGE: caddy@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
          CLOUDFLARED_IMAGE: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          PRIME_HF_TOKEN_FILE: /tmp/placeholder-not-a-token
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.huggingface.yml config --quiet

  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build production image
        run: docker build -t prime:acceptance .
      - name: Start deterministic Ollama acceptance fixture
        run: |
          docker network create prime-acceptance
          docker run -d --name fake-ollama --network prime-acceptance --network-alias ollama \
            -v "${{ github.workspace }}/tests:/fixture:ro" \
            python:3.12-alpine python /fixture/fake_ollama.py
      - name: Create persistent data volume
        run: docker volume create prime-acceptance-data
      - name: Boot PRIME
        run: |
          docker run -d --name prime-acceptance \
            --network prime-acceptance \
            -p 18000:8000 \
            -v prime-acceptance-data:/data \
            -e OLLAMA_BASE_URL=http://ollama:11434 \
            -e PRIME_FAST_MODEL=gemma3:1b \
            -e PRIME_DEEP_MODEL=gemma3:1b \
            -e PRIME_EMBED_MODEL=embeddinggemma:300m-qat-q4_0 \
            -e PRIME_MULTI_SPECIALIST_WORKERS=2 \
            -e PRIME_SPINE_TOKEN=acceptance-secret \
            -e PRIME_REGISTRY_V1_ENABLED=1 \
            -e PRIME_SPINE_DB=/data/prime-spine.db \
            -e PRIME_MEMORY_DB=/data/jarvis-memory.db \
            -e PORTAL_BASE_URL= \
            prime:acceptance
      - name: Verify local production control and durable artifact roundtrip
        run: |
          docker exec -i prime-acceptance python - <<'PY'
          import hashlib, json, time, urllib.error, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8000'
          origin={'Origin':base, 'Content-Type':'application/json'}
          def request(path, method='GET', body=None, headers=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path, data=data, method=method, headers=headers or {})
              with urllib.request.urlopen(req, timeout=10) as response:
                  raw=response.read()
                  return response.status, raw, response.headers
          for _ in range(30):
              try:
                  status, raw, _=request('/health')
                  assert status==200 and json.loads(raw)=={'ok':True}
                  break
              except (urllib.error.URLError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('local PRIME health did not become ready')
          status, html, headers=request('/control')
          assert status==200 and b'PRIME Control' in html
          assert headers['X-Frame-Options']=='DENY' and headers['Cache-Control']=='no-store'
          body={'objective':'Hash supplied text','context':'hello',
                'capability':'responsibility.a02','deterministic_operation':'sha256'}
          try:
              request('/control/api/objectives', 'POST', body)
              raise AssertionError('mutation without same-origin header was admitted')
          except urllib.error.HTTPError as error:
              assert error.code==403
          try:
              request('/api/compute-queue/jobs')
              raise AssertionError('protected API was readable without authentication')
          except urllib.error.HTTPError as error:
              assert error.code==401
          status, raw, _=request('/control/api/objectives', 'POST', body, origin)
          assert status==202
          task_id=json.loads(raw)['id']
          status, raw, _=request('/control/api/objectives/'+task_id)
          task=json.loads(raw)
          assert status==200 and task['state']=='COMPLETED'
          artifact_id=task['steps'][0]['dispatch']['artifact']['artifact_id']
          status, artifact, headers=request('/control/api/artifacts/'+artifact_id)
          assert status==200 and hashlib.sha256(b'hello').hexdigest().encode() in artifact
          assert headers['Content-Disposition']=='attachment'
          Path('/data/acceptance-task-id').write_text(task_id)
          print('local control, origin/auth boundary, artifact roundtrip verified')
          PY
      - name: Verify Docker gateway cannot enter local control
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=5)
              raise AssertionError('Docker gateway unexpectedly reached local control')
          except urllib.error.HTTPError as error:
              assert error.code==403
          print('Docker gateway denied')
          PY
      - name: Verify objective and artifact survive container restart
        run: |
          docker rm -f prime-acceptance
          docker run -d --name prime-acceptance \
            --network prime-acceptance \
            -p 18000:8000 \
            -v prime-acceptance-data:/data \
            -e OLLAMA_BASE_URL=http://ollama:11434 \
            -e PRIME_FAST_MODEL=gemma3:1b \
            -e PRIME_DEEP_MODEL=gemma3:1b \
            -e PRIME_EMBED_MODEL=embeddinggemma:300m-qat-q4_0 \
            -e PRIME_MULTI_SPECIALIST_WORKERS=2 \
            -e PRIME_SPINE_TOKEN=acceptance-secret \
            -e PRIME_REGISTRY_V1_ENABLED=1 \
            -e PRIME_SPINE_DB=/data/prime-spine.db \
            -e PRIME_MEMORY_DB=/data/jarvis-memory.db \
            -e PORTAL_BASE_URL= \
            prime:acceptance
          docker exec -i prime-acceptance python - <<'PY'
          import hashlib, json, time, urllib.error, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8000'
          task_id=Path('/data/acceptance-task-id').read_text()
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'/control/api/objectives/'+task_id, timeout=2) as response:
                      task=json.loads(response.read())
                  assert task['state']=='COMPLETED'
                  artifact_id=task['steps'][0]['dispatch']['artifact']['artifact_id']
                  with urllib.request.urlopen(base+'/control/api/artifacts/'+artifact_id, timeout=2) as response:
                      assert hashlib.sha256(b'hello').hexdigest().encode() in response.read()
                  print('durable objective and artifact verified after restart')
                  break
              except (urllib.error.URLError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('durable objective unavailable after restart')
          PY
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs prime-acceptance || true
          docker logs fake-ollama || true
