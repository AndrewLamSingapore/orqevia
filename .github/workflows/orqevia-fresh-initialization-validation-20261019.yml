name: Orqevia fresh29 initialization public validation - 20261019 batch

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: orqevia-fresh-init-ce9a3f5a5d5da918-first-validation-only
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'AndrewLamSingapore/orqevia' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing bounded protected validation dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 httpx==0.28.1 fastapi==0.116.1
      - name: One-shot protected public validation
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORQEVIA_DATA_DIR: ${{ runner.temp }}/orqevia-initialization-validation-domains
          ORQEVIA_COMPUTE_QUEUE_DB: ${{ runner.temp }}/orqevia-initialization-validation-domains/compute-queue.db
        run: python -B -m scripts.validate_fresh_initialization_20261019
      - name: Preserve exact validation or failure custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initialization-ce9a3f5a5d5da918-validation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fresh-initialization-validation-output/
          if-no-files-found: error
          retention-days: 30
